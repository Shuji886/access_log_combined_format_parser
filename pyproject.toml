[project]
name = "access-log-combined-format-parser"
version = "0.1.0"
description = "Decodes Apache and Nginx access log entries into structured fields using only the standard library."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
